version: '3.8'

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./envirotrack:/envirotrack
      - ./backups:/backups
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-dbname}
      - DB_USER=${DB_USER:-dbuser}
      - DB_PASS=${DB_PASS:-pass}
      - DB_HOST=database
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-django-insecure-_yc=yo8(hf*if!^n*!(gdyo1tpbtk-r&%wfj7o#+w7zmm#q2$@}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-Pass37198word!}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - database
      - redis
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py shell -c \"from django.contrib.auth.models import User; import os; username=os.environ['DJANGO_SUPERUSER_USERNAME']; password=os.environ['DJANGO_SUPERUSER_PASSWORD']; User.objects.filter(username=username).exists() or User.objects.create_superuser(username, '', password)\" &&
      gunicorn envirotrack.wsgi:application --bind 0.0.0.0:8000 --access-logfile - --error-logfile - --log-level info
      "
    networks:
      - envirotrack-network

  database:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dbname}
      - POSTGRES_USER=${POSTGRES_USER:-dbuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - envirotrack-network

  redis:
    image: redis:7.0.5-alpine
    hostname: redis
    networks:
      - envirotrack-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PG_CLIENT: "true"
    command: sh -c "sleep 10 && celery -A envirotrack worker --loglevel=info"
    volumes:
      - ./envirotrack:/envirotrack
      - ./backups:/backups
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-dbname}
      - DB_USER=${DB_USER:-dbuser}
      - DB_PASS=${DB_PASS:-pass}
      - DB_HOST=database
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-django-insecure-_yc=yo8(hf*if!^n*!(gdyo1tpbtk-r&%wfj7o#+w7zmm#q2$@}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web-app
      - redis
    networks:
      - envirotrack-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "sleep 10 && celery -A envirotrack beat --loglevel=info"
    volumes:
      - ./envirotrack:/envirotrack
      - ./backups:/backups
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-dbname}
      - DB_USER=${DB_USER:-dbuser}
      - DB_PASS=${DB_PASS:-pass}
      - DB_HOST=database
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-django-insecure-_yc=yo8(hf*if!^n*!(gdyo1tpbtk-r&%wfj7o#+w7zmm#q2$@}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web-app
      - redis
    networks:
      - envirotrack-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./envirotrack/frontend/build:/app/frontend/build
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./envirotrack/media:/envirotrack/media
      - ./envirotrack/static:/envirotrack/static
    depends_on:
      - web-app
    networks:
      - envirotrack-network

networks:
  envirotrack-network:
    driver: bridge

volumes:
  db-data:
