x-backend-environment: &backend-environment
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${DB_NAME:-dbname}
  DB_USER: ${DB_USER:-dbuser}
  DB_PASS: ${DB_PASS:-pass}
  DB_HOST: database
  DB_PORT: "5432"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-_yc=yo8(hf*if!^n*!(gdyo1tpbtk-r&%wfj7o#+w7zmm#q2$@}
  CELERY_BROKER_URL: redis://redis:6379/0

# Весь .env передаётся в контейнеры, как в Метрологии: новые переменные
# (DJANGO_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS и т.п.) не нужно дописывать
# сюда руками. Без .env стек тоже поднимается на значениях по умолчанию.
x-backend-env-file: &backend-env-file
  - path: .env
    required: false

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: *backend-env-file
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "1"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Pass37198word!}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - ./envirotrack:/envirotrack
      - ./backups:/backups
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - envirotrack-network

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbname}
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - envirotrack-network

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - envirotrack-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PG_CLIENT: "true"
    restart: unless-stopped
    init: true
    command: celery -A envirotrack worker --loglevel=info --concurrency=2
    env_file: *backend-env-file
    environment:
      <<: *backend-environment
    volumes:
      - ./envirotrack:/envirotrack
      - ./backups:/backups
    depends_on:
      web-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - envirotrack-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: celery -A envirotrack beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: *backend-env-file
    environment:
      <<: *backend-environment
    volumes:
      - ./envirotrack:/envirotrack
      - ./backups:/backups
    depends_on:
      web-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - envirotrack-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ueip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./envirotrack/media:/envirotrack/media:ro
      - ./envirotrack/static:/envirotrack/static:ro
    depends_on:
      web-app:
        condition: service_healthy
    networks:
      - envirotrack-network

networks:
  envirotrack-network:
    driver: bridge

volumes:
  db-data:
