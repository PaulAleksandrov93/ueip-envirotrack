worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /app/frontend/build;
            index  index.html index.htm;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }

        location /static/ {
            alias /app/frontend/build/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Результат collectstatic: админка, её оформление и DRF.
        location ~ ^/static/(admin|backend|rest_framework)/ {
            root /envirotrack;
            expires 1d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /envirotrack/media/;
            autoindex off;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /api/ {
            proxy_pass http://web-app:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        location /admin/ {
            proxy_pass http://web-app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
            client_max_body_size 50m;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
